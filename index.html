const { useState, useRef, useCallback, useEffect } = React;

// ---------- أيقونات بسيطة (بدون أي مكتبة خارجية) ----------

function Ic({ children, size = 16, className = "", solid = false, viewBox = "0 0 24 24" }) {
  return (
    <svg width={size} height={size} viewBox={viewBox} fill={solid ? "currentColor" : "none"}
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children}
    </svg>
  );
}
const Play = (p) => <Ic {...p} solid><polygon points="6 3 20 12 6 21 6 3" /></Ic>;
const Pause = (p) => <Ic {...p} solid><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></Ic>;
const Plus = (p) => <Ic {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Ic>;
const Search = (p) => <Ic {...p}><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Ic>;
const Star = (p) => <Ic {...p}><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2" /></Ic>;
const Film = (p) => <Ic {...p}><rect x="3" y="4" width="18" height="16" rx="1" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /></Ic>;
const Volume2 = (p) => <Ic {...p}><polygon points="4 9 8 9 12 5 12 19 8 15 4 15" /><path d="M16 8a5 5 0 0 1 0 8" /><path d="M18.5 5.5a9 9 0 0 1 0 13" /></Ic>;
const VolumeX = (p) => <Ic {...p}><polygon points="4 9 8 9 12 5 12 19 8 15 4 15" /><line x1="17" y1="9" x2="23" y2="15" /><line x1="23" y1="9" x2="17" y2="15" /></Ic>;
const X = (p) => <Ic {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Ic>;
const Trash2 = (p) => <Ic {...p}><polyline points="3 6 5 6 21 6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></Ic>;
const FolderPlus = (p) => <Ic {...p}><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" /><line x1="12" y1="10" x2="12" y2="16" /><line x1="9" y1="13" x2="15" y2="13" /></Ic>;
const Check = (p) => <Ic {...p}><polyline points="20 6 9 17 4 12" /></Ic>;
const MoreVertical = (p) => <Ic {...p} solid><circle cx="12" cy="5" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="12" cy="19" r="1.6" /></Ic>;
const Upload = (p) => <Ic {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></Ic>;
const SkipForward = (p) => <Ic {...p} solid><polygon points="5 4 15 12 5 20 5 4" /><rect x="17" y="4" width="2.5" height="16" /></Ic>;
const Settings = (p) => <Ic {...p}><line x1="4" y1="7" x2="20" y2="7" /><circle cx="9" cy="7" r="2" fill="#0a0a0a" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="16" cy="12" r="2" fill="#0a0a0a" /><line x1="4" y1="17" x2="20" y2="17" /><circle cx="11" cy="17" r="2" fill="#0a0a0a" /></Ic>;
const Images = (p) => <Ic {...p}><rect x="3" y="6" width="14" height="14" rx="1" /><path d="M7 2h12a2 2 0 0 1 2 2v12" /></Ic>;

// ---------- أدوات مساعدة ----------

function formatDuration(sec) {
  if (!isFinite(sec) || sec <= 0) return "٠٠:٠٠";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const toAr = (n) => String(n).padStart(2, "0").replace(/[0-9]/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
  return `${toAr(m)}:${toAr(s)}`;
}

function resolutionLabel(w, h) {
  const long = Math.max(w, h);
  if (long >= 3840) return "4K";
  if (long >= 1920) return "HD";
  if (long >= 1280) return "HD٧٢٠";
  return "SD";
}

function generateThumbnail(url) {
  return new Promise((resolve) => {
    const video = document.createElement("video");
    video.src = url;
    video.muted = true;
    video.crossOrigin = "anonymous";
    video.preload = "metadata";
    const cleanup = () => video.remove();
    video.addEventListener("loadedmetadata", () => {
      const seekTo = Math.min(1, video.duration / 4 || 0);
      video.currentTime = seekTo;
    });
    video.addEventListener("seeked", () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = Math.round((320 * video.videoHeight) / video.videoWidth) || 180;
        const ctx = canvas.getContext("2d");
        ctx.filter = "grayscale(100%) contrast(1.05)";
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const thumb = canvas.toDataURL("image/jpeg", 0.75);
        resolve({ thumb, duration: video.duration, width: video.videoWidth, height: video.videoHeight });
      } catch (e) {
        resolve({ thumb: null, duration: video.duration, width: video.videoWidth, height: video.videoHeight });
      } finally { cleanup(); }
    });
    video.addEventListener("error", () => { resolve({ thumb: null, duration: 0, width: 0, height: 0 }); cleanup(); });
  });
}

const ACCENTS = [
  { id: "mono", name: "أبيض", value: "#ffffff" },
  { id: "amber", name: "كهرماني", value: "#F5C24C" },
  { id: "crimson", name: "قرمزي", value: "#EF6461" },
  { id: "mint", name: "نعناعي", value: "#6FD08C" },
  { id: "azure", name: "سماوي", value: "#6EC1E4" },
  { id: "violet", name: "بنفسجي", value: "#C9A6F5" },
];

function SprocketStrip({ className = "" }) {
  const holes = Array.from({ length: 28 });
  return (
    <div className={`flex justify-between px-3 ${className}`} aria-hidden="true">
      {holes.map((_, i) => <div key={i} className="w-[7px] h-[7px] rounded-[2px] bg-black/70" style={{ opacity: 0.55 }} />)}
    </div>
  );
}

function SettingsPopover({ accent, onSelect, onClose }) {
  return (
    <div className="absolute left-0 top-11 z-30 bg-[#0d0d0d] border border-white/15 w-60 p-4 shadow-2xl" onClick={(e) => e.stopPropagation()}>
      <div className="flex items-center justify-between mb-3">
        <p className="text-white/80 text-xs font-semibold tracking-wide">لون التطبيق</p>
        <button onClick={onClose} className="text-white/40 hover:text-white" aria-label="إغلاق"><X size={13} /></button>
      </div>
      <div className="grid grid-cols-6 gap-2 mb-3">
        {ACCENTS.map((a) => (
          <button key={a.id} onClick={() => onSelect(a.value)} title={a.name}
            className="w-7 h-7 rounded-full flex items-center justify-center border transition-transform hover:scale-110"
            style={{ backgroundColor: a.value, borderColor: accent === a.value ? "#fff" : "rgba(255,255,255,0.15)" }} aria-label={a.name}>
            {accent === a.value && <Check size={12} className="text-black" />}
          </button>
        ))}
      </div>
      <p className="text-white/25 text-[10px] leading-relaxed">القاعدة تبقى أسود وأبيض دائمًا — اللون المختار يُستخدم فقط لإبراز الأزرار والعناصر النشطة.</p>
    </div>
  );
}

function AlbumCover({ title, count, thumbs, onClick, onNew, accent }) {
  if (onNew) {
    return (
      <button onClick={onClick} className="aspect-square border border-dashed border-white/15 hover:border-white/40 flex flex-col items-center justify-center gap-2 text-white/40 hover:text-white/70 transition-colors">
        <Plus size={22} /><span className="text-xs">ألبوم جديد</span>
      </button>
    );
  }
  return (
    <button onClick={onClick} className="group text-right">
      <div className="aspect-square grid grid-cols-2 grid-rows-2 gap-[2px] bg-black border border-white/10 overflow-hidden">
        {Array.from({ length: 4 }).map((_, i) => thumbs[i]
          ? <img key={i} src={thumbs[i]} className="w-full h-full object-cover grayscale group-hover:opacity-80 transition-opacity" />
          : <div key={i} className="w-full h-full bg-[#141414] flex items-center justify-center"><Film size={14} className="text-white/10" /></div>
        )}
      </div>
      <p className="text-white/85 text-sm mt-2 truncate" style={{ fontFamily: "'Tajawal', sans-serif" }}>{title}</p>
      <p className="text-[11px] font-mono mt-0.5" style={{ color: accent }}>{count} مقطع</p>
    </button>
  );
}

function AlbumsGallery({ collections, videos, onOpen, onCreate, accent }) {
  return (
    <div>
      <div className="grid gap-x-5 gap-y-8" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))" }}>
        <AlbumCover title="المفضلة" count={videos.filter((v) => v.favorite).length}
          thumbs={videos.filter((v) => v.favorite).slice(0, 4).map((v) => v.thumb)}
          onClick={() => onOpen("favorites")} accent={accent} />
        {collections.map((c) => {
          const inAlbum = videos.filter((v) => v.collections.includes(c.id));
          return <AlbumCover key={c.id} title={c.name} count={inAlbum.length} thumbs={inAlbum.slice(0, 4).map((v) => v.thumb)} onClick={() => onOpen(c.id)} accent={accent} />;
        })}
        <AlbumCover onNew onClick={onCreate} />
      </div>
      {collections.length === 0 && <p className="text-white/30 text-xs mt-8">أنشئ أول ألبوم لترتيب فيديوهاتك في مجموعات — مثل "سفر"، "عمل" أو "عائلة".</p>}
    </div>
  );
}

function Player({ video, onClose, accent }) {
  const videoRef = useRef(null);
  const [playing, setPlaying] = useState(true);
  const [progress, setProgress] = useState(0);
  const [dur, setDur] = useState(0);
  const [muted, setMuted] = useState(false);
  const [showControls, setShowControls] = useState(true);
  const hideTimer = useRef(null);

  useEffect(() => { const v = videoRef.current; if (v) v.play().catch(() => setPlaying(false)); }, []);

  const resetHideTimer = () => {
    setShowControls(true);
    clearTimeout(hideTimer.current);
    hideTimer.current = setTimeout(() => setShowControls(false), 2600);
  };
  useEffect(() => { resetHideTimer(); return () => clearTimeout(hideTimer.current); }, []);

  const togglePlay = () => {
    const v = videoRef.current; if (!v) return;
    if (v.paused) { v.play(); setPlaying(true); } else { v.pause(); setPlaying(false); }
  };
  const onTimeUpdate = () => { const v = videoRef.current; if (!v) return; setProgress(v.currentTime); setDur(v.duration || 0); };
  const seek = (e) => { const v = videoRef.current; if (!v) return; const val = Number(e.target.value); v.currentTime = val; setProgress(val); };
  const skip = (delta) => { const v = videoRef.current; if (!v) return; v.currentTime = Math.min(Math.max(0, v.currentTime + delta), v.duration || 0); };

  return (
    <div className="fixed inset-0 z-50 bg-black flex flex-col" onMouseMove={resetHideTimer} dir="rtl">
      <div className={`transition-opacity duration-300 ${showControls ? "opacity-100" : "opacity-0"}`}><SprocketStrip className="pt-3" /></div>
      <div className="flex-1 flex items-center justify-center relative overflow-hidden">
        <video ref={videoRef} src={video.url} className="max-h-full max-w-full" onTimeUpdate={onTimeUpdate} onLoadedMetadata={onTimeUpdate} onClick={togglePlay} onEnded={() => setPlaying(false)} muted={muted} />
        <button onClick={onClose} className={`absolute top-6 left-6 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-all duration-300 ${showControls ? "opacity-100" : "opacity-0"}`} aria-label="إغلاق المشغل"><X size={18} /></button>
        <div className={`absolute top-6 right-6 text-white/70 text-xs tracking-[0.2em] uppercase font-mono transition-opacity duration-300 ${showControls ? "opacity-100" : "opacity-0"}`}>{video.resLabel} · {video.width}×{video.height}</div>
      </div>
      <div className={`transition-opacity duration-300 ${showControls ? "opacity-100" : "opacity-0"}`}>
        <div className="px-6 md:px-10 pb-5">
          <h2 className="text-white text-lg font-semibold mb-3 truncate" style={{ fontFamily: "'Tajawal', sans-serif" }}>{video.name}</h2>
          <input type="range" min={0} max={dur || 0} value={progress} onChange={seek} className="w-full h-1 cursor-pointer" style={{ accentColor: accent }} />
          <div className="flex items-center justify-between mt-3">
            <div className="flex items-center gap-4">
              <button onClick={() => skip(-10)} className="text-white/80 hover:text-white" aria-label="رجوع ١٠ ثواني"><SkipForward size={20} className="rotate-180" /></button>
              <button onClick={togglePlay} className="w-11 h-11 rounded-full text-black flex items-center justify-center hover:scale-105 transition-transform" style={{ backgroundColor: accent }} aria-label={playing ? "إيقاف مؤقت" : "تشغيل"}>
                {playing ? <Pause size={18} /> : <Play size={18} className="mr-[-2px]" />}
              </button>
              <button onClick={() => skip(10)} className="text-white/80 hover:text-white" aria-label="تقديم ١٠ ثواني"><SkipForward size={20} /></button>
              <span className="text-white/50 text-xs font-mono ml-2">{formatDuration(progress)} / {formatDuration(dur)}</span>
            </div>
            <button onClick={() => setMuted((m) => !m)} className="text-white/80 hover:text-white" aria-label="كتم الصوت">{muted ? <VolumeX size={18} /> : <Volume2 size={18} />}</button>
          </div>
        </div>
        <SprocketStrip className="pb-3" />
      </div>
    </div>
  );
}

function VideoCard({ video, index, onPlay, onToggleFavorite, onDelete, onAssign, collections, accent }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [assignOpen, setAssignOpen] = useState(false);
  return (
    <div className="group relative">
      <div className="relative aspect-video bg-[#111] border border-white/10 overflow-hidden cursor-pointer" onClick={() => onPlay(video)}>
        {video.thumb ? <img src={video.thumb} alt={video.name} className="w-full h-full object-cover grayscale group-hover:scale-[1.03] transition-transform duration-500" /> : <div className="w-full h-full flex items-center justify-center text-white/30"><Film size={28} /></div>}
        <div className="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-colors flex items-center justify-center">
          <div className="w-11 h-11 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all scale-90 group-hover:scale-100" style={{ backgroundColor: accent }}>
            <Play size={16} className="text-black mr-[-2px]" />
          </div>
        </div>
        <span className="absolute top-2 right-2 text-[10px] font-mono tracking-widest bg-black/70 text-white/80 px-1.5 py-0.5 border border-white/10">№{String(index + 1).padStart(3, "0")}</span>
        {video.resLabel === "4K" && <span className="absolute top-2 left-2 text-[10px] font-bold tracking-widest text-black px-1.5 py-0.5" style={{ backgroundColor: accent }}>4K</span>}
        <span className="absolute bottom-2 left-2 text-[10px] font-mono bg-black/70 text-white/80 px-1.5 py-0.5">{formatDuration(video.duration)}</span>
      </div>
      <div className="flex items-start justify-between mt-2 gap-2">
        <div className="min-w-0">
          <p className="text-white/90 text-sm truncate" style={{ fontFamily: "'Tajawal', sans-serif" }}>{video.name}</p>
          <p className="text-white/35 text-[11px] font-mono mt-0.5">{video.resLabel} · {video.width}×{video.height}</p>
        </div>
        <div className="relative shrink-0">
          <button onClick={(e) => { e.stopPropagation(); setMenuOpen((v) => !v); }} className="text-white/40 hover:text-white p-1" aria-label="خيارات"><MoreVertical size={16} /></button>
          {menuOpen && (
            <div className="absolute left-0 top-7 z-20 bg-[#0d0d0d] border border-white/15 w-44 text-sm shadow-xl" onClick={(e) => e.stopPropagation()}>
              <button onClick={() => { onToggleFavorite(video.id); setMenuOpen(false); }} className="w-full text-right px-3 py-2 flex items-center gap-2 text-white/80 hover:bg-white/10">
                <Star size={14} className={video.favorite ? "fill-white text-white" : ""} />{video.favorite ? "إزالة من المفضلة" : "أضف للمفضلة"}
              </button>
              <button onClick={() => setAssignOpen((v) => !v)} className="w-full text-right px-3 py-2 flex items-center gap-2 text-white/80 hover:bg-white/10"><FolderPlus size={14} /> أضف إلى مجموعة</button>
              {assignOpen && (
                <div className="border-t border-white/10 max-h-40 overflow-y-auto">
                  {collections.length === 0 && <p className="px-3 py-2 text-white/30 text-xs">لا توجد مجموعات بعد</p>}
                  {collections.map((c) => (
                    <button key={c.id} onClick={() => onAssign(video.id, c.id)} className="w-full text-right px-3 py-1.5 flex items-center justify-between text-white/70 hover:bg-white/10 text-xs">
                      {c.name}{video.collections.includes(c.id) && <Check size={12} />}
                    </button>
                  ))}
                </div>
              )}
              <button onClick={() => { onDelete(video.id); setMenuOpen(false); }} className="w-full text-right px-3 py-2 flex items-center gap-2 text-red-400/80 hover:bg-red-500/10 border-t border-white/10"><Trash2 size={14} /> حذف</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ReelArchive() {
  const [videos, setVideos] = useState([]);
  const [collections, setCollections] = useState([]);
  const [activeView, setActiveView] = useState("all");
  const [only4K, setOnly4K] = useState(false);
  const [query, setQuery] = useState("");
  const [playing, setPlaying] = useState(null);
  const [newCollectionOpen, setNewCollectionOpen] = useState(false);
  const [newCollectionName, setNewCollectionName] = useState("");
  const [uploading, setUploading] = useState(false);
  const [accent, setAccent] = useState("#ffffff");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const fileInputRef = useRef(null);

  const handleFiles = useCallback(async (fileList) => {
    const files = Array.from(fileList).filter((f) => f.type.startsWith("video/"));
    if (files.length === 0) return;
    setUploading(true);
    for (const file of files) {
      const url = URL.createObjectURL(file);
      const meta = await generateThumbnail(url);
      setVideos((prev) => [...prev, {
        id: crypto.randomUUID(), name: file.name.replace(/\.[^/.]+$/, ""), url,
        thumb: meta.thumb, duration: meta.duration, width: meta.width, height: meta.height,
        resLabel: resolutionLabel(meta.width, meta.height), favorite: false, collections: [],
      }]);
    }
    setUploading(false);
  }, []);

  const onDrop = (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); };
  const toggleFavorite = (id) => setVideos((prev) => prev.map((v) => v.id === id ? { ...v, favorite: !v.favorite } : v));
  const deleteVideo = (id) => setVideos((prev) => prev.filter((v) => v.id !== id));
  const assignToCollection = (videoId, collectionId) => setVideos((prev) => prev.map((v) => {
    if (v.id !== videoId) return v;
    const has = v.collections.includes(collectionId);
    return { ...v, collections: has ? v.collections.filter((c) => c !== collectionId) : [...v.collections, collectionId] };
  }));

  const createCollection = () => {
    const name = newCollectionName.trim();
    if (!name) return;
    const id = crypto.randomUUID();
    setCollections((prev) => [...prev, { id, name }]);
    setNewCollectionName(""); setNewCollectionOpen(false); setActiveView(id);
  };
  const deleteCollection = (id) => {
    setCollections((prev) => prev.filter((c) => c.id !== id));
    setVideos((prev) => prev.map((v) => ({ ...v, collections: v.collections.filter((c) => c !== id) })));
    if (activeView === id) setActiveView("all");
  };

  let visible = videos;
  if (activeView === "favorites") visible = visible.filter((v) => v.favorite);
  else if (activeView !== "all" && activeView !== "albums-hub") visible = visible.filter((v) => v.collections.includes(activeView));
  if (only4K) visible = visible.filter((v) => v.resLabel === "4K");
  if (query.trim()) { const q = query.trim().toLowerCase(); visible = visible.filter((v) => v.name.toLowerCase().includes(q)); }

  const activeCollection = collections.find((c) => c.id === activeView);
  const viewTitle = activeView === "all" ? "كل الفيديوهات" : activeView === "favorites" ? "المفضلة" : activeView === "albums-hub" ? "الألبومات" : activeCollection?.name || "";

  return (
    <div dir="rtl" className="min-h-screen w-full bg-[#0a0a0a] text-white flex" style={{ fontFamily: "'IBM Plex Sans Arabic', sans-serif" }} onDragOver={(e) => e.preventDefault()} onDrop={onDrop}>
      <aside className="w-60 shrink-0 border-l border-white/10 flex flex-col h-screen sticky top-0">
        <div className="px-5 py-6 border-b border-white/10 relative">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-full border-2 flex items-center justify-center" style={{ borderColor: accent }}><div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: accent }} /></div>
              <h1 className="text-xl font-black tracking-tight" style={{ fontFamily: "'Tajawal', sans-serif" }}>بكرة</h1>
            </div>
            <button onClick={() => setSettingsOpen((v) => !v)} className="text-white/40 hover:text-white p-1" aria-label="تخصيص لون التطبيق"><Settings size={16} /></button>
          </div>
          <p className="text-white/35 text-[11px] mt-1.5">أرشيفك الشخصي للأفلام</p>
          {settingsOpen && (<><div className="fixed inset-0 z-20" onClick={() => setSettingsOpen(false)} /><SettingsPopover accent={accent} onSelect={setAccent} onClose={() => setSettingsOpen(false)} /></>)}
        </div>

        <nav className="flex-1 overflow-y-auto py-4 px-3 space-y-0.5">
          <button onClick={() => setActiveView("all")} className="w-full text-right px-3 py-2 text-sm flex items-center justify-between transition-colors font-semibold" style={activeView === "all" ? { backgroundColor: accent, color: "#000" } : { color: "rgba(255,255,255,0.7)" }}>
            <span>كل الفيديوهات</span><span className="text-xs opacity-60 font-mono">{videos.length}</span>
          </button>
          <button onClick={() => setActiveView("favorites")} className="w-full text-right px-3 py-2 text-sm flex items-center justify-between transition-colors" style={activeView === "favorites" ? { backgroundColor: accent, color: "#000", fontWeight: 600 } : { color: "rgba(255,255,255,0.7)" }}>
            <span className="flex items-center gap-2"><Star size={13} className={activeView === "favorites" ? "fill-black" : ""} />المفضلة</span>
            <span className="text-xs opacity-60 font-mono">{videos.filter((v) => v.favorite).length}</span>
          </button>
          <button onClick={() => setActiveView("albums-hub")} className="w-full text-right px-3 py-2 text-sm flex items-center gap-2 transition-colors" style={activeView === "albums-hub" ? { backgroundColor: accent, color: "#000", fontWeight: 600 } : { color: "rgba(255,255,255,0.7)" }}>
            <Images size={13} />الألبومات
          </button>

          <div className="pt-4 pb-1.5 px-3 flex items-center justify-between">
            <span className="text-white/30 text-[11px] tracking-widest uppercase">المجموعات</span>
            <button onClick={() => setNewCollectionOpen((v) => !v)} className="text-white/40 hover:text-white"><Plus size={14} /></button>
          </div>
          {newCollectionOpen && (
            <div className="px-3 pb-2 flex gap-1">
              <input autoFocus value={newCollectionName} onChange={(e) => setNewCollectionName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && createCollection()} placeholder="اسم المجموعة" className="flex-1 bg-white/5 border border-white/15 px-2 py-1 text-xs outline-none focus:border-white/40" />
              <button onClick={createCollection} className="text-black px-2 text-xs" style={{ backgroundColor: accent }}>إضافة</button>
            </div>
          )}
          {collections.map((c) => (
            <div key={c.id} className="group flex items-center">
              <button onClick={() => setActiveView(c.id)} className="flex-1 text-right px-3 py-2 text-sm flex items-center justify-between transition-colors" style={activeView === c.id ? { backgroundColor: accent, color: "#000", fontWeight: 600 } : { color: "rgba(255,255,255,0.7)" }}>
                <span className="truncate">{c.name}</span><span className="text-xs opacity-60 font-mono">{videos.filter((v) => v.collections.includes(c.id)).length}</span>
              </button>
              <button onClick={() => deleteCollection(c.id)} className="opacity-0 group-hover:opacity-100 text-white/30 hover:text-red-400 px-1" aria-label="حذف المجموعة"><X size={12} /></button>
            </div>
          ))}
        </nav>

        <div className="p-3 border-t border-white/10">
          <button onClick={() => fileInputRef.current?.click()} className="w-full text-black py-2.5 text-sm font-semibold flex items-center justify-center gap-2 hover:opacity-90 transition-opacity" style={{ backgroundColor: accent }}><Upload size={15} /> إضافة فيديو</button>
          <input ref={fileInputRef} type="file" accept="video/*" multiple className="hidden" onChange={(e) => handleFiles(e.target.files)} />
        </div>
      </aside>

      <main className="flex-1 h-screen overflow-y-auto">
        <SprocketStrip className="pt-2 opacity-30" />
        <div className="px-8 pt-6 pb-4 flex flex-wrap items-center gap-4 justify-between">
          <div>
            <h2 className="text-2xl font-black" style={{ fontFamily: "'Tajawal', sans-serif" }}>{viewTitle}</h2>
            <p className="text-white/35 text-xs mt-1 font-mono">{activeView === "albums-hub" ? `${collections.length + 1} ألبوم` : `${visible.length} من ${videos.length} مقطع`}</p>
          </div>
          <div className="flex items-center gap-3">
            {activeView !== "albums-hub" && (
              <div className="relative">
                <Search size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-white/30" />
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ابحث في المكتبة..." className="bg-white/5 border border-white/10 pr-9 pl-3 py-2 text-sm outline-none focus:border-white/40 w-56" />
              </div>
            )}
            {activeView !== "albums-hub" && (
              <button onClick={() => setOnly4K((v) => !v)} className="px-3 py-2 text-xs font-bold tracking-wide border transition-colors" style={only4K ? { backgroundColor: accent, color: "#000", borderColor: accent } : { borderColor: "rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.6)" }}>4K فقط</button>
            )}
          </div>
        </div>

        <div className="px-8 pb-16">
          {uploading && <p className="text-white/40 text-xs mb-4 font-mono animate-pulse">جارِ معالجة الفيديو...</p>}
          {activeView === "albums-hub" ? (
            <AlbumsGallery collections={collections} videos={videos} onOpen={setActiveView} onCreate={() => setNewCollectionOpen(true)} accent={accent} />
          ) : visible.length === 0 ? (
            <div className="border border-dashed border-white/15 py-24 flex flex-col items-center justify-center text-center cursor-pointer hover:border-white/30 transition-colors" onClick={() => fileInputRef.current?.click()}>
              <Film size={30} className="text-white/20 mb-4" />
              <p className="text-white/50 text-sm">{videos.length === 0 ? "مكتبتك فارغة — أضف أول فيديو" : "لا توجد نتائج مطابقة"}</p>
              {videos.length === 0 && <p className="text-white/25 text-xs mt-2">اسحب وأفلت الملفات هنا، أو اضغط للاختيار</p>}
            </div>
          ) : (
            <div className="grid gap-x-5 gap-y-7" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))" }}>
              {visible.map((v) => (
                <VideoCard key={v.id} video={v} index={videos.indexOf(v)} onPlay={setPlaying} onToggleFavorite={toggleFavorite} onDelete={deleteVideo} onAssign={assignToCollection} collections={collections} accent={accent} />
              ))}
            </div>
          )}
        </div>
      </main>

      {playing && <Player video={playing} onClose={() => setPlaying(null)} accent={accent} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ReelArchive />);
</script>
</body>
</html>
